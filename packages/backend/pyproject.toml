[project]
name = "hestia"
version = "0.1.0"
description = "Personal on-demand service gateway: proxy, wake on request, sleep when idle."
readme = "../../README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
hestia = "hestia.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]  # B008: FastAPI Depends() defaults

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.ruff.lint.isort]
known-first-party = ["hestia"]
known-local-folder = ["conftest", "fake_upstream"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["tests"]
